repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: .venv/Scripts/python.exe -m ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format check
        entry: .venv/Scripts/python.exe -m ruff format --check
        language: system
        types: [python]
