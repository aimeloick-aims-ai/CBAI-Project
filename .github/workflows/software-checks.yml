name: Software checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: environment/requirements-win-py311.lock
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r environment/requirements-win-py311.lock
      - name: Verify source and tests
        run: python scripts/run_all_checks.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: software-verification
          path: reports/software_verification/
